services:
  - type: web
    name: proofchain-ai-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: FRONTEND_URL
        value: https://dilippalanisamy.github.io/Proofchain-AI
      - key: GOOGLE_REDIRECT_URI
        value: https://proofchain-ai.onrender.com/auth/google/callback
      - key: GOOGLE_CLIENT_ID
        value: 1077914640486-ol0ln1t4iuv2j3q7i1q1sibdl7kasq34.apps.googleusercontent.com
      - key: GOOGLE_CLIENT_SECRET
        sync: false
