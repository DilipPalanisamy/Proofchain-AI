services:
  - type: web
    name: proofchain-ai-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: FRONTEND_URL
        value: https://dilippalanisamy.github.io/Proofchain-AI
      - key: GOOGLE_REDIRECT_URI
        value: https://proofchain-ai-backend.onrender.com/auth/google/callback
